# Builds the portable Windows app (CV-Tailor-Windows.zip).
# - Push a tag like v1.0.0 -> the zip is attached to a GitHub Release.
# - Or run it by hand from the Actions tab -> the zip is under the run's "Artifacts".
name: Windows app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm cv-tailor.spec
      - name: Smoke test (start the app and call it)
        shell: pwsh
        run: |
          $p = Start-Process dist/CV-Tailor/CV-Tailor.exe -WorkingDirectory dist/CV-Tailor -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod http://127.0.0.1:8000/api/health; if ($r.status -eq "ok") { $ok = $true; break } } catch {}
          }
          Stop-Process $p -Force
          Remove-Item dist/CV-Tailor/.env, dist/CV-Tailor/my_cv -Recurse -ErrorAction SilentlyContinue
          if (-not $ok) { throw "The app did not start" }
      - name: Add instructions
        shell: pwsh
        run: |
          @"
          CV Tailor Agent - portable Windows app

          1. Keep this whole folder together (you can move it anywhere, e.g. a USB stick).
          2. Double-click CV-Tailor.exe. Your browser opens the app. Keep the black window open while you use it.
          3. Click Settings, choose your AI provider and paste your API key. It is saved in this folder (.env).
          4. Your master CV is saved in this folder too (my_cv\master_cv.md).

          First start: Windows may show "Windows protected your PC". Click "More info", then "Run anyway".
          This appears because the app isn't code-signed by a paid certificate.
          To stop the app, close the black window.
          "@ | Set-Content dist/CV-Tailor/README.txt
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/CV-Tailor -DestinationPath CV-Tailor-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CV-Tailor-Windows
          path: CV-Tailor-Windows.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CV-Tailor-Windows.zip
