# One-click public demo on Render (render.com -> New -> Blueprint -> pick this repo).
# Demo mode: visitors bring their own API key (kept in their browser), nothing is stored on the server,
# the master CV is off, and AI runs are limited per visitor. Without a key the free rule-based mode runs.
services:
  - type: web
    name: cv-tailor-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MODE
        value: demo
      - key: LLM_PROVIDER
        value: mock
      - key: DEMO_RUNS_PER_HOUR
        value: "8"
